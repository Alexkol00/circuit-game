<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚡ Юный электрик — собери схему!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
:root{
  --ink:#2b3a42; --paper:#ffffff;
  --blue:#118ab2; --green:#2fb46f; --orange:#ff9f1c; --red:#ef476f;
  --card-shadow:0 6px 18px rgba(30,60,90,.14);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; color:var(--ink);
  font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',Verdana,sans-serif;
  background:linear-gradient(165deg,#8ed6ff 0%,#bdf0e2 45%,#fff3c9 100%);
  user-select:none; overflow:hidden;
}
.hidden{display:none !important;}
button{font-family:inherit;}

/* ---------- общие кнопки ---------- */
.btn{
  border:none; border-radius:999px; padding:10px 20px; font-size:17px; font-weight:bold;
  color:#fff; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.18); transition:transform .08s, opacity 0.2s;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.18);}
.btn.green{background:var(--green);}
.btn.orange{background:var(--orange);}
.btn.blue{background:var(--blue);}
.btn.red{background:var(--red);}
.btn.gray{background:#8aa0ad;}
.btn.big{font-size:21px; padding:14px 30px;}
.btn.round{width:46px; height:46px; padding:0; font-size:20px; line-height:1;}
.btn:disabled, .btn.locked{opacity:.45; cursor:default; pointer-events:none;}

/* ---------- меню ---------- */
#menu{position:absolute; inset:0; overflow:auto; display:flex; flex-direction:column; align-items:center; padding:26px 14px 60px;}
#menu h1{font-size:min(52px,8vw); margin:8px 0 2px; text-shadow:0 3px 0 #fff8, 0 6px 14px rgba(0,60,90,.25); letter-spacing:1px;}
#menu .sub{font-size:19px; margin:0 0 20px; color:#1d5b73; background:#ffffffcc; padding:6px 18px; border-radius:999px;}
.menurow{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:6px 0 22px;}
#levels{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; max-width:860px;}
.lvl{
  width:112px; height:118px; border-radius:20px; background:var(--paper); box-shadow:var(--card-shadow);
  border:3px solid #ffffff; display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; transition:transform .1s; position:relative; font-size:15px;
}
.lvl:hover{transform:scale(1.06) rotate(-1deg);}
.lvl .num{font-size:34px; font-weight:bold; color:var(--blue); line-height:1;}
.lvl .name{font-size:12.5px; text-align:center; padding:0 4px; color:#51646e; line-height:1.15;}
.lvl .stars{font-size:14px; letter-spacing:1px; margin-top:3px; min-height:18px;}
.lvl.locked{filter:grayscale(1); opacity:.6; cursor:not-allowed;}
.lvl.sandbox{background:linear-gradient(160deg,#fffbe6,#ffe9b3); width:240px; height:118px;}
.lvl.sandbox .num{font-size:30px;}
#menu .foot{margin-top:26px; font-size:14px; color:#40606e;}
#menu .foot a{color:var(--blue); cursor:pointer; text-decoration:underline;}

/* ---------- игровой экран ---------- */
#game{position:absolute; inset:0; display:flex; flex-direction:column;}
#topbar{
  display:flex; align-items:center; gap:10px; padding:8px 12px;
  background:#ffffffd9; border-bottom:3px solid #e3eef5;
}
#lvlname{font-size:19px; font-weight:bold; color:#17546b; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#main{flex:1; display:flex; gap:10px; padding:10px; min-height:0;}

#palette{
  width:138px; flex:none; background:#ffffffd9; border-radius:18px; padding:10px 8px;
  display:flex; flex-direction:column; gap:8px; overflow-y:auto; box-shadow:var(--card-shadow);
}
#palette h3{margin:0 0 2px; font-size:14.5px; color:#51646e; text-align:center;}
.pal{
  background:#fff; border:3px solid #eaf3f8; border-radius:14px; padding:5px 4px 6px;
  display:flex; flex-direction:column; align-items:center; cursor:grab; touch-action:none;
}
.pal:hover{border-color:var(--orange); background:#fff8ec;}
.pal.armed{border-color:var(--green); background:#effaf2;}
.pal svg{width:84px; height:48px; pointer-events:none;}
.pal span{font-size:12.5px; color:#41545e; margin-top:1px; pointer-events:none;}

#stage{flex:1; position:relative; min-width:0;}
#canvas{
  width:100%; height:100%; display:block; border-radius:18px; touch-action:none;
  background-color:#fdfeff; box-shadow:var(--card-shadow);
  background-image:radial-gradient(#dce9f1 2px, transparent 2.3px); background-size:26px 26px;
}
#canvas.wiring{cursor:crosshair;}
#emptyHint{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  background:#ffffffeb; border-radius:18px; padding:14px 22px; text-align:center;
  font-size:16.5px; color:#3c5460; box-shadow:var(--card-shadow); pointer-events:none; line-height:1.55;
}
#emptyHint b{color:var(--orange);}

#goalcard{
  position:absolute; right:12px; top:12px; width:250px; background:#ffffffee;
  border-radius:16px; padding:12px 13px; box-shadow:var(--card-shadow); border:3px solid #ffe9b8;
}
#goalcard .gt{font-size:13.5px; font-weight:bold; color:#b06a00; margin-bottom:4px;}
#goalcard .goaltext{font-size:14.5px; line-height:1.35; margin-bottom:10px;}
#goalcard.shake{animation:shakeX .4s;}
#goalcard .row{display:flex; gap:8px;}
#goalcard .row .btn{flex:1; padding:9px 6px; font-size:15px;}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

#comptools{
  position:absolute; display:flex; gap:6px; transform:translate(-50%,-100%);
  background:#263a46; border-radius:12px; padding:5px 7px; box-shadow:0 4px 12px rgba(0,0,0,.3);
}
#comptools button{
  border:none; border-radius:9px; width:36px; height:34px; font-size:17px; cursor:pointer; background:#405967; color:#fff;
}
#comptools button:hover{background:var(--blue);}

/* ---------- SVG схемы ---------- */
.wpath{fill:none; stroke-width:5; stroke-linecap:round;}
.whit{fill:none; stroke:transparent; stroke-width:16; cursor:pointer;}
.wireg.selected .wpath{stroke:#ef476f !important; stroke-width:6.5;}
.curr{fill:none; stroke:#ffffff; stroke-width:6.5; stroke-linecap:round; stroke-dasharray:0.1 13;}
.curr.fw{animation:dashfw .55s linear infinite;}
.curr.bw{animation:dashbw .55s linear infinite;}
@keyframes dashfw{from{stroke-dashoffset:0;}to{stroke-dashoffset:-13.1;}}
@keyframes dashbw{from{stroke-dashoffset:0;}to{stroke-dashoffset:13.1;}}
.comp{cursor:grab;}
.comp:active{cursor:grabbing;}
.term{fill:#fff; stroke:#41545e; stroke-width:2.5; cursor:crosshair; transition:transform .12s; transform-box:fill-box; transform-origin:center;}
.term:hover{transform:scale(1.45);}
#canvas.wiring .term{transform:scale(1.35); stroke:var(--orange);}
.term.pos{stroke:#e53935;}
.term.neg{stroke:#1e88e5;}
.rotor{animation:spin 1s linear infinite; transform-box:fill-box; transform-origin:center;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes spinrev{to{transform:rotate(-360deg);}}
.rotor.rev{animation:spinrev 1s linear infinite; transform-box:fill-box; transform-origin:center;}
.shakeon{animation:bellshake .35s ease-in-out infinite; transform-box:fill-box; transform-origin:center bottom;}
@keyframes bellshake{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
.rays{animation:raypulse 1.1s ease-in-out infinite;}
@keyframes raypulse{0%,100%{opacity:.45;}50%{opacity:1;}}
#tempwire{pointer-events:none;}

/* ---------- модальные окна ---------- */
#modal{position:fixed; inset:0; background:rgba(15,40,60,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
#modalCard{
  background:#fff; border-radius:26px; padding:22px 26px; max-width:560px; width:100%;
  box-shadow:0 20px 60px rgba(0,20,40,.4); text-align:center; max-height:92vh; overflow:auto;
}
#modalCard h2{margin:4px 0 10px; font-size:26px;}
#modalCard .prof{display:flex; gap:14px; align-items:flex-start; text-align:left; margin-bottom:8px;}
#modalCard .prof .face{font-size:52px; flex:none; animation:bob 2.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#modalCard .prof p{margin:0; font-size:16.5px; line-height:1.45;}
#modalCard .demo{background:#f4fafd; border-radius:16px; padding:6px; margin:10px 0 4px; border:2px dashed #bcd8e6;}
#modalCard .demo svg{width:100%; max-width:420px; display:block; margin:0 auto;}
#modalCard .btnrow{display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap;}
.winstars{font-size:44px; letter-spacing:6px; margin:4px 0;}
.winstars .off{filter:grayscale(1); opacity:.35;}

/* ---------- метки полярности на клеммах ---------- */
.plabel{font-size:16px;font-weight:bold;font-family:Arial,sans-serif;paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round;pointer-events:none;}
.plabel.pos{fill:#e53935;}
.plabel.neg{fill:#1e88e5;}
.plabel.any{fill:#78909c;font-size:15px;}
#wireTip{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  background:#263a46;color:#fff;padding:9px 18px;border-radius:14px;font-size:14.5px;
  box-shadow:0 6px 18px rgba(0,0,0,.3);display:none;pointer-events:none;z-index:6;max-width:88%;text-align:center;line-height:1.4;
}
#wireTip.show{display:block;}
#wireTip b{color:#ffd54f;}

#toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:#263a46; color:#fff; padding:11px 22px; border-radius:16px; font-size:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.35); z-index:60; max-width:min(520px,90vw); text-align:center; line-height:1.4;
}
.confp{position:fixed; top:-24px; z-index:80; pointer-events:none; animation:fall 2.8s linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}

/* ---------- Азбука электрика ---------- */
.ttabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 12px;max-height:130px;overflow-y:auto;padding:2px;}
.ttab{border:2px solid #dceaf2;background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;color:#41545e;font-weight:bold;}
.ttab:hover{border-color:var(--blue);}
.ttab.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.tpage{text-align:left;font-size:15.5px;line-height:1.55;}
.tpage p{margin:8px 0;}
.tpage .demo{margin:10px 0;}
.tpage .demo svg{width:100%;max-width:430px;}
.demorow{display:flex;gap:10px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin:10px 0;}
.democol{flex:1;min-width:200px;text-align:center;}
.democol .demo{margin:0 0 6px;padding:4px;}
.cap{font-size:13px;color:#41545e;font-weight:bold;line-height:1.35;}
.democol.bad .demo{border-color:#ffb3c1;background:#fff5f7;}
.democol.good .demo{border-color:#b7e4c7;background:#f2fbf5;}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
.tcard{background:#f4fafd;border:2px solid #dceaf2;border-radius:14px;padding:8px;text-align:center;font-size:12.5px;}
.tcard svg{width:100%;height:54px;}
.tcard b{display:block;font-size:13.5px;margin-top:2px;color:#17546b;}
.tcard span{color:#51646e;line-height:1.3;display:block;margin-top:2px;}
.warnbox{background:#fff0f3;border:2px solid #ffb3c1;border-radius:14px;padding:10px 14px;margin:10px 0;}
.safelist{list-style:none;padding:0;margin:8px 0;}
.safelist li{background:#f4fafd;border:2px solid #e3eef5;border-radius:14px;padding:9px 14px;margin:7px 0;font-size:15px;line-height:1.45;}
.dict{margin:4px 0;}
.dict dt{font-weight:bold;color:#17546b;margin-top:11px;font-size:15.5px;}
.dict dd{margin:2px 0 0 0;font-size:14.5px;color:#41545e;line-height:1.5;}
.factbox{background:#eef7fb;border:2px solid #cfe7f3;border-radius:14px;padding:10px 14px;margin:10px 0;font-size:14.5px;line-height:1.45;text-align:left;}
.tnav{align-items:center;}
.tcount{font-size:14px;color:#51646e;min-width:56px;}
.rotor2{animation:spin 2.6s linear infinite;transform-box:fill-box;transform-origin:center;}

@media (max-width:720px){
  #main{flex-direction:column;}
  #palette{width:auto; flex-direction:row; flex-wrap:wrap; max-height:132px;}
  .pal{flex:1; min-width:86px;}
  #goalcard{width:210px; right:8px; top:8px; padding:9px 10px;}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="blur5" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
</svg>

<div id="menu" class="screen">
  <h1>⚡ Юный электрик ⚡</h1>
  <p class="sub">Собирай настоящие электрические схемы и проходи уровни!</p>
  <div class="menurow">
    <button class="btn green" id="btnTheory">📖 Азбука электрика</button>
    <button class="btn blue" id="btnHowto">❓ Как играть</button>
    <button class="btn orange" id="btnReset">🗑 Сбросить прогресс</button>
  </div>
  <div id="levels"></div>
  <p class="foot">Игра для юных изобретателей • всё работает прямо в браузере, даже без интернета</p>
</div>

<div id="game" class="screen hidden">
  <div id="topbar">
    <button class="btn blue round" id="btnMenu" title="В меню">🏠</button>
    <div id="lvlname"></div>
    <button class="btn orange round" id="btnRestart" title="Начать уровень заново">♻️</button>
    <button class="btn green round" id="btnTheory2" title="Азбука электрика">📖</button>
    <button class="btn gray round" id="btnSound" title="Звук">🔊</button>
  </div>
  <div id="main">
    <aside id="palette"><h3>🧰 Детали</h3></aside>
    <div id="stage">
      <svg id="canvas" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet">
        <g id="gWires"></g>
        <g id="gComps"></g>
        <g id="gTerms"></g>
        <g id="tempwire"></g>
      </svg>
      <div id="emptyHint" class="hidden"></div>
      <div id="wireTip">🔌 Тяни провод к другой <b>клемме</b> — кружочку на детали!</div>
      <div id="comptools" class="hidden">
        <button id="toolRot" title="Повернуть (R)">⟳</button>
        <button id="toolDel" title="Удалить (Delete)">🗑</button>
      </div>
      <div id="goalcard">
        <div class="gt">🎯 Задание</div>
        <div class="goaltext"></div>
        <div class="row">
          <button class="btn green" id="btnCheck">✅ Проверить</button>
          <button class="btn orange" id="btnHint">💡</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="modal" class="hidden"><div id="modalCard"></div></div>
<div id="toast" class="hidden"></div>

<script>
'use strict';
/* ================= утилиты и защита от случайных кликов ================= */
const $=s=>document.querySelector(s);
const SVG='http://www.w3.org/2000/svg';
const snap=v=>Math.round(v/20)*20;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function rotPt(x,y,r){const a=r*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return{x:x*c-y*s,y:x*s+y*c};}
function E(tag,attrs,inner){let s='<'+tag;for(const k in attrs)s+=' '+k+'="'+attrs[k]+'"';
  return inner===undefined?s+'/>' : s+'>'+inner+'</'+tag+'>';}
let _nid=1; const nid=()=>_nid++;

// Защита от спам-кликов
function debounceBtn(fn, ms = 1000) {
    return function(e) {
        if (this.classList.contains('locked')) return;
        this.classList.add('locked');
        setTimeout(() => this.classList.remove('locked'), ms);
        fn.call(this, e);
    }
}

/* ================= звук ================= */
let actx=null, muted=false;
try{ muted = localStorage.getItem('ye_muted')==='1'; }catch(e){}
function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended')actx.resume(); return actx; }
function tone(f,dur,type,vol,slide){
  if(muted)return; const c=audio(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,c.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+dur);
  g.gain.setValueAtTime(vol||0.12,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
  o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+dur+0.02);
}
const sClick =()=>tone(700,0.07,'square',0.06);
const sPop   =()=>tone(300,0.12,'sine',0.14,600);
const sFail  =()=>{tone(160,0.25,'sawtooth',0.1);setTimeout(()=>tone(120,0.3,'sawtooth',0.1),120);};
const sDing  =()=>{tone(1318,0.5,'triangle',0.1);tone(1975,0.4,'sine',0.05);};
const sSpark =()=>tone(90,0.35,'sawtooth',0.16,40);
function sWin(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'triangle',0.12),i*130));}

/* ================= каталог деталей ================= */
const COMP={
  battery:{name:'Батарейка',terms:[{x:-32,y:0},{x:32,y:0}],
    draw(c,st,sim){
      const hot=sim&&sim.short;
      let s=E('rect',{x:-30,y:-17,width:60,height:34,rx:8,fill:hot?'#ff8a65':'#ffd54f',stroke:'#a07600','stroke-width':3});
      s+=E('text',{x:-20,y:7,'font-size':17,fill:'#1565c0','font-weight':'bold','font-family':'Arial'},'−');
      s+=E('text',{x:13,y:7,'font-size':15,fill:'#c62828','font-weight':'bold','font-family':'Arial'},'+');
      s+=E('text',{x:-2,y:7,'font-size':12,fill:'#8a6400','text-anchor':'middle'},'⚡');
      if(hot)s+=E('text',{y:-22,'font-size':20,'text-anchor':'middle'},'🔥');
      return s;
    }},
  lamp:{name:'Лампочка',terms:[{x:-30,y:0},{x:30,y:0}],
    draw(c,st,sim){
      const on=st&&st.on, dim=on&&sim&&sim.dim;
      let s='';
      if(on){
        s+=E('circle',{r:dim?24:30,fill:'#ffd23f',opacity:dim?0.35:0.6,filter:'url(#blur5)'});
        if(!dim){
          let rays='';
          for(let i=0;i<8;i++){const a=i*Math.PI/4;
            rays+=E('line',{x1:Math.cos(a)*25,y1:Math.sin(a)*25,x2:Math.cos(a)*33,y2:Math.sin(a)*33,stroke:'#ffb300','stroke-width':3.5,'stroke-linecap':'round'});}
          s+=E('g',{class:'rays'},rays);
        }
      }
      s+=E('circle',{r:19,fill:on?(dim?'#ffe9a8':'#ffe066'):'#ffffff',stroke:'#37474f','stroke-width':3});
      s+=E('path',{d:'M-11 -11 L11 11 M-11 11 L11 -11',stroke:'#37474f','stroke-width':3,'stroke-linecap':'round',fill:'none'});
      s+=E('line',{x1:-30,y1:0,x2:-19,y2:0,stroke:'#37474f','stroke-width':3});
      s+=E('line',{x1:19,y1:0,x2:30,y2:0,stroke:'#37474f','stroke-width':3});
      return s;
    }},
  switch:{name:'Выключатель',terms:[{x:-30,y:0},{x:30,y:0}],
    draw(c){
      const closed=!!(c.props&&c.props.closed);
      let s=E('line',{x1:-30,y1:0,x2:-20,y2:0,stroke:'#37474f','stroke-width':3});
      s+=E('line',{x1:20,y1:0,x2:30,y2:0,stroke:'#37474f','stroke-width':3});
      s+=E('circle',{cx:-16,cy:0,r:4.5,fill:'#fff',stroke:'#37474f','stroke-width':3});
      s+=E('circle',{cx:16,cy:0,r:4.5,fill:'#fff',stroke:'#37474f','stroke-width':3});
      s+=closed
        ?E('line',{x1:-16,y1:0,x2:16,y2:0,stroke:'#ef6c00','stroke-width':5,'stroke-linecap':'round'})
        :E('line',{x1:-16,y1:0,x2:13,y2:-16,stroke:'#ef6c00','stroke-width':5,'stroke-linecap':'round'});
      if(!closed)s+=E('text',{x:0,y:-24,'font-size':13,fill:'#9aa7ad','text-anchor':'middle'},'нажми!');
      return s;
    }},
  button:{name:'Кнопка',terms:[{x:-30,y:0},{x:30,y:0}],
    draw(c){
      const p=!!(c.props&&c.props.pressed);
      let s=E('line',{x1:-30,y1:0,x2:-18,y2:0,stroke:'#37474f','stroke-width':3});
      s+=E('line',{x1:18,y1:0,x2:30,y2:0,stroke:'#37474f','stroke-width':3});

/* ================= симуляция (ИСПРАВЛЕНО) ================= */
function simulate(components,wires,opts){
  opts=opts||{};
  const res={on:{},wireDir:{},closed:false,short:false,dim:false};
  const bat=components.find(c=>c.type==='battery');
  if(!bat)return res;

  const ignored=id=>opts.ignore&&opts.ignore.has(id);
  const unscrewed=id=>opts.unscrewed&&opts.unscrewed.has(id);

  // Светодиоды, отключённые из-за неверной полярности
  const offLeds=new Set();

  const isConducting=c=>{
    if(unscrewed(c.id)) return false;
    if(c.type==='battery')return false;
    if(c.type==='switch')return opts.switchState?opts.switchState==='closed':!!c.props.closed;
    if(c.type==='button')return opts.buttonState?opts.buttonState==='pressed':!!c.props.pressed;
    if(c.type==='led')return !offLeds.has(c.id);
    return true;
  };
  const plus=bat.id+':1', minus=bat.id+':0';

  /* ---- короткое замыкание: прямая связь + и − без нагрузки ---- */
  const uf=new Map();
  components.forEach(c=>COMP[c.type].terms.forEach((t,i)=>uf.set(c.id+':'+i,c.id+':'+i)));
  const find=n=>{while(uf.get(n)!==n){uf.set(n,uf.get(uf.get(n)));n=uf.get(n);}return n;};
  const uni=(a,b)=>{a=find(a);b=find(b);if(a!==b)uf.set(a,b);};
  wires.forEach(w=>{if(!ignored(w.a.c)&&!ignored(w.b.c))uni(w.a.c+':'+w.a.t,w.b.c+':'+w.b.t);});
  components.forEach(c=>{if((c.type==='switch'||c.type==='button')&&isConducting(c))uni(c.id+':0',c.id+':1');});
  if(find(plus)===find(minus)){
    res.short=true;
    components.forEach(c=>res.on[c.id]={on:false});
    return res;
  }

  /* ---- построение графа; skipId — деталь, у которой "убираем" внутреннее ребро ---- */
  function buildAdj(skipId){
    const adj=new Map();
    components.forEach(c=>COMP[c.type].terms.forEach((t,i)=>adj.set(c.id+':'+i,[])));
    const addE=(a,b)=>{adj.get(a).push(b);adj.get(b).push(a);};
    wires.forEach(w=>{if(!ignored(w.a.c)&&!ignored(w.b.c))addE(w.a.c+':'+w.a.t,w.b.c+':'+w.b.t);});
    components.forEach(c=>{
      if(c.id===skipId) return;
      if(!ignored(c.id)&&isConducting(c))addE(c.id+':0',c.id+':1');
    });
    return adj;
  }
  function bfs(adj,start){
    const R=new Set([start]);
    const d=new Map([[start,0]]);
    const q=[start];
    while(q.length){
      const n=q.shift();
      for(const m of (adj.get(n)||[])){
        if(!R.has(m)){R.add(m);d.set(m,d.get(n)+1);q.push(m);}
      }
    }
    return {R,d};
  }

  /* ---- итеративно отключаем светодиоды, включённые не той стороной ---- */
  for(let iter=0;iter<4;iter++){
    const adj=buildAdj(null);
    const r=bfs(adj,plus);
    if(!r.R.has(minus)) break;
    let changed=false;
    components.forEach(c=>{
      if(c.type!=='led'||offLeds.has(c.id)||ignored(c.id)||unscrewed(c.id))return;
      const d0=r.d.get(c.id+':0'), d1=r.d.get(c.id+':1');
      if(d0!==undefined && d1!==undefined && d1<d0){
        offLeds.add(c.id); changed=true;
      }
    });
    if(!changed) break;
  }

  /* ---- финальный граф ---- */
  const fullAdj=buildAdj(null);
  const rpFull=bfs(fullAdj,plus);
  res.closed=rpFull.R.has(minus);

  /* ---- направление анимации тока в проводах ---- */
  wires.forEach(w=>{
    const a=w.a.c+':'+w.a.t, b=w.b.c+':'+w.b.t;
    if(rpFull.R.has(a)&&rpFull.R.has(b)&&rpFull.d.has(a)&&rpFull.d.has(b))
      res.wireDir[w.id]=rpFull.d.get(a)<=rpFull.d.get(b)?1:-1;
  });

  /* ---- по каждой детали: течёт ли через неё ток от + к − ---- */
  components.forEach(c=>{
    if(ignored(c.id) || unscrewed(c.id)){res.on[c.id]={on:false};return;}
    if(c.type==='battery'){res.on[c.id]={on:res.closed};return;}
    if(c.type==='led' && offLeds.has(c.id)){res.on[c.id]={on:false,reverse:true};return;}

    // Граф БЕЗ этой детали: ищем путь "плюс → t0" и "t1 → минус" (или наоборот)
    const adj=buildAdj(c.id);
    const Rp=bfs(adj,plus).R;
    const Rm=bfs(adj,minus).R;
    const t0=c.id+':0', t1=c.id+':1';
    const fwd=Rp.has(t0) && Rm.has(t1);
    const rev=Rp.has(t1) && Rm.has(t0);
    const on=fwd || rev;
    res.on[c.id]={on, reverse:rev && !fwd, fwd, rev};
  });

  res.dim=components.some(c=>res.on[c.id]&&res.on[c.id].on&&c.type==='resistor');
  return res;
}

/* ================= геометрия и отрисовка ================= */
const svg=$('#canvas'), gWires=$('#gWires'), gComps=$('#gComps'), gTerms=$('#gTerms'), gTemp=$('#tempwire');
function compById(id){return S.components.find(c=>c.id===id);}
function termPos(c,i){const t=COMP[c.type].terms[i];const p=rotPt(t.x,t.y,c.rot||0);return{x:c.x+p.x,y:c.y+p.y};}
function termDir(c,i){const t=COMP[c.type].terms[i];const d=rotPt(Math.sign(t.x),0,c.rot||0);return d.x||d.y?d:{x:1,y:0};}
function wireD(p1,d1,p2,d2){
  const k=clamp(dist(p1,p2)*0.35,18,36);
  const c1={x:p1.x+d1.x*k,y:p1.y+d1.y*k},c2={x:p2.x+d2.x*k,y:p2.y+d2.y*k};
  return 'M'+p1.x+' '+p1.y+' C '+c1.x+' '+c1.y+', '+c2.x+' '+c2.y+', '+p2.x+' '+p2.y;
}
function circuitMarkup(cs,ws,sm,mini){
  let out='';
  ws.forEach(w=>{
    const A=termPosOf(cs,w.a),B=termPosOf(cs,w.b);
    const d=wireD(A,dirOf(cs,w.a),B,dirOf(cs,w.b));
    const fd=sm.wireDir[w.id];
    out+='<g class="wireg'+(S.selWire===w.id&&!mini?' selected':'')+'"'+(mini?'':' data-wire="'+w.id+'"')+'>'+
      '<path class="whit" d="'+d+'"'+(mini?'':' data-wire="'+w.id+'"')+'/>'+
      '<path class="wpath" d="'+d+'" style="stroke:'+(mini?'#546e7a':w.color)+'"/>'+
      (fd?'<path class="curr '+(fd>0?'fw':'bw')+'" d="'+d+'"/>':'')+'</g>';
  });
  const cnt={};
  ws.forEach(w=>{cnt[w.a.c+':'+w.a.t]=(cnt[w.a.c+':'+w.a.t]||0)+1;cnt[w.b.c+':'+w.b.t]=(cnt[w.b.c+':'+w.b.t]||0)+1;});
  cs.forEach(c=>COMP[c.type].terms.forEach((t,i)=>{
    if((cnt[c.id+':'+i]||0)>=2){const p=termPos(c,i);out+='<circle cx="'+p.x+'" cy="'+p.y+'" r="5" fill="#41545e"/>';}
  }));
  cs.forEach(c=>{
    const st=sm.on[c.id]||{on:false};
    out+='<g class="comp"'+(mini?'':' data-comp="'+c.id+'"')+' transform="translate('+c.x+','+c.y+') rotate('+(c.rot||0)+')">'+COMP[c.type].draw(c,st,sm)+'</g>';
  });
  if(!mini){
    cs.forEach(c=>COMP[c.type].terms.forEach((t,i)=>{
      const p=termPos(c,i), d=termDir(c,i);
      let tip='',label=null;
      if(c.type==='battery'){
        label=i===0?{txt:'−',cls:'neg'}:{txt:'+',cls:'pos'};
        tip=i===0?'Батарейка «−» — сюда ток ВОЗВРАЩАЕТСЯ':'Батарейка «+» — отсюда ток ВЫХОДИТ';
      }else if(c.type==='led' || c.type==='motor'){
        label=i===0?{txt:'+',cls:'pos'}:{txt:'−',cls:'neg'};
        tip=i===0?COMP[c.type].name+' «+»':COMP[c.type].name+' «−»';
        if (c.type === 'motor') tip += ' (от полярности зависит направление вращения)';
      }else{
        label={txt:'↔',cls:'any'};
        tip=COMP[c.type].name+' (полярность не важна — подключай как удобно)';
      }
      out+=E('circle',{class:'term'+(c.type==='battery'?(i===0?' neg':' pos'):''),'data-comp':c.id,'data-term':i,cx:p.x,cy:p.y,r:7.5},'<title>'+tip+'</title>');
      if(label)out+=E('text',{class:'plabel '+label.cls,x:p.x+d.x*15.5,y:p.y+d.y*15.5+5.5,'text-anchor':'middle'},label.txt);
    }));
  }
  return out;
}
function termPosOf(cs,ref){const c=cs.find(x=>x.id===ref.c);return c?termPos(c,ref.t):{x:0,y:0};}
function dirOf(cs,ref){const c=cs.find(x=>x.id===ref.c);return c?termDir(c,ref.t):{x:1,y:0};}

function svgPoint(e){
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const m=svg.getScreenCTM();if(!m)return null;
  const p=pt.matrixTransform(m.inverse());
  return {x:clamp(p.x,40,960),y:clamp(p.y,40,600)};
}
function svgToScreen(x,y){
  const pt=svg.createSVGPoint();pt.x=x;pt.y=y;
  const m=svg.getScreenCTM();if(!m)return{x:0,y:0};
  const q=pt.matrixTransform(m);
  const r=$('#stage').getBoundingClientRect();
  return{x:q.x-r.left,y:q.y-r.top};
}
function updateTools(){
  const t=$('#comptools');
  const c=S.sel!==null&&compById(S.sel);
  if(c){
    const p=svgToScreen(c.x,c.y-52);
    t.style.left=p.x+'px';t.style.top=(p.y-6)+'px';
    $('#toolRot').style.display='';
    t.classList.remove('hidden');
    return;
  }
  const w=S.selWire!==null&&S.wires.find(x=>x.id===S.selWire);
  if(w){
    const A=termPosOf(S.components,w.a),B=termPosOf(S.components,w.b);
    const mid=svgToScreen((A.x+B.x)/2,(A.y+B.y)/2);
    t.style.left=mid.x+'px';t.style.top=(mid.y-14)+'px';
    $('#toolRot').style.display='none';
    t.classList.remove('hidden');
    return;
  }
  t.classList.add('hidden');
}

/* ================= теория: Азбука электрика ================= */
function flowDotsPath(d,opts){
  opts=opts||{};
  const color=opts.color||'#ff5252',r=opts.r||4.5,per=opts.per||3,dur=opts.dur||2.4,seed=opts.seed||0;
  let out='';
  for(let k=0;k<per;k++)out+=E('circle',{r:r,fill:color,stroke:'#fff','stroke-width':1},
    E('animateMotion',{dur:dur+'s',repeatCount:'indefinite',path:d,begin:(-(seed+k*dur/per)).toFixed(2)+'s'}));
  return out;
}
function flowDots(cs,ws,sm,opts){
  let out='';const o=opts||{};
  ws.forEach((w,wi)=>{
    if(!sm.wireDir[w.id])return;
    const A=termPosOf(cs,w.a),B=termPosOf(cs,w.b);
    out+=flowDotsPath(wireD(A,dirOf(cs,w.a),B,dirOf(cs,w.b)),{color:o.color,r:o.r,per:o.per,dur:o.dur,seed:wi*0.45});
  });
  return out;
}
function theoryCircuit(def,opts){
  const cs=def.components.map((c,i)=>({id:'d'+i,type:c.type,x:c.x,y:c.y,rot:0,props:{closed:def.closed!==false,pressed:!!def.pressed}}));
  const ws=def.wires.map((w,i)=>({id:'dw'+i,color:'#546e7a',a:{c:w[0],t:w[1]},b:{c:w[2],t:w[3]}}));
  const sm=simulate(cs,ws);
  return '<svg viewBox="'+def.vb+'" xmlns="'+SVG+'">'+circuitMarkup(cs,ws,sm,true)+flowDots(cs,ws,sm,opts)+'</svg>';
}

      E('circle',{r:18,fill:'none',stroke:'#2b3a42','stroke-width':3})+

      E('circle',{cx:-12,cy:0,r:3.5,fill:'#2b3a42'})+

function symbolsSVG(){

/* Экономия электричества — карточки-иконки */
function saveEnergySVG(){
  const tips=[
    {e:'💡',t:'Гаси свет, когда выходишь из комнаты'},
    {e:'🔌',t:'Вынимай зарядки из розетки'},
    {e:'❄️',t:'Закрывай дверцу холодильника'},
    {e:'⏰',t:'Выключай технику из режима ожидания'},
  ];
  let s='<svg viewBox="0 0 400 220">';
  tips.forEach((tip,i)=>{
    const x = 105 + (i%2)*190;
    const y = 55 + Math.floor(i/2)*100;
    s+='<g transform="translate('+x+','+y+')">';
    s+=E('rect',{x:-85,y:-38,width:170,height:76,rx:16,fill:'#f2fbf5',stroke:'#2fb46f','stroke-width':2.5});
    s+=E('text',{x:-55,y:14,'font-size':36,'text-anchor':'middle'},tip.e);
    const words = tip.t.split(' ');
    const mid = Math.ceil(words.length/2);
    const l1 = words.slice(0,mid).join(' ');
    const l2 = words.slice(mid).join(' ');
    s+=E('text',{x:20,y:l2?-4:6,'font-size':11,'text-anchor':'middle','font-weight':'bold',fill:'#17546b'},l1);
    if(l2) s+=E('text',{x:20,y:11,'font-size':11,'text-anchor':'middle','font-weight':'bold',fill:'#17546b'},l2);
    s+='</g>';
  });
  s+='</svg>';
  return s;
}

/* ================= цели уровней ================= */
function lampsAllOn(sm,cs){const ls=cs.filter(c=>c.type==='lamp');return ls.length>0&&ls.every(l=>sm.on[l.id]&&sm.on[l.id].on);}
function checkGoal(){
  const cs=S.components;
  const closedOpts=cs.some(c=>c.type==='switch')?{switchState:'closed'}:{};
  switch(LV.n){
    case 1:
      return lampsAllOn(simulate(cs,S.wires),cs)
        ?{ok:true}
        :{ok:false,msg:'Лампочка не светится. Проверь: обе клеммы лампочки соединены? Цепь замкнута в круг?'};
    case 2:{
      if(!cs.some(c=>c.type==='switch'))return{ok:false,msg:'Добавь выключатель! Возьми его в панели слева.'};
      if(!lampsAllOn(simulate(cs,S.wires,{switchState:'closed'}),cs))
        return{ok:false,msg:'При включённом выключателе лампочка не горит — проверь соединения.'};
      if(lampsAllOn(simulate(cs,S.wires,{switchState:'open'}),cs))
        return{ok:false,msg:'Лампочка должна гаснуть при выключенном выключателе! Ток должен идти ЧЕРЕЗ выключатель.'};
      return{ok:true};}
    case 3:{
      const ls=cs.filter(c=>c.type==='lamp');
      if(ls.length<2)return{ok:false,msg:'Нужно две лампочки! Перетащи вторую из панели.'};
      const sm=simulate(cs,S.wires,closedOpts);
      if(!lampsAllOn(sm,cs))return{ok:false,msg:'Не все лампочки горят — проверь цепочку.'};
      for(const l of ls){
        const sm2=simulate(cs, S.wires, Object.assign({},closedOpts,{unscrewed:new Set([l.id])}));
        const others=cs.filter(c=>c.type==='lamp'&&c.id!==l.id);
        if(others.some(o=>sm2.on[o.id]&&sm2.on[o.id].on))
          return{ok:false,msg:'Лампочки соединены параллельно. Соедини их одной цепочкой: «+» → лампа → лампа → «−».'};
      }
      return{ok:true};}
    case 4:{
      const ls=cs.filter(c=>c.type==='lamp');
      if(ls.length<2)return{ok:false,msg:'Нужно две лампочки! Перетащи вторую из панели.'};
      const sm=simulate(cs,S.wires,closedOpts);
      if(!lampsAllOn(sm,cs))return{ok:false,msg:'Не все лампочки горят — проверь соединения.'};
      for(const l of ls){
        const sm2=simulate(cs, S.wires, Object.assign({},closedOpts,{unscrewed:new Set([l.id])}));
        const others=cs.filter(c=>c.type==='lamp'&&c.id!==l.id);
        if(!others.every(o=>sm2.on[o.id]&&sm2.on[o.id].on))
          return{ok:false,msg:'Пока что одна лампочка зависит от другой — это последовательная цепь. Сделай две отдельные веточки между одними и теми же точками!'};
      }
      return{ok:true};}
    case 5:{
      const m=cs.find(c=>c.type==='motor');
      if(!m)return{ok:false,msg:'Добавь моторчик из панели слева!'};
      return (sim.on[m.id]&&sim.on[m.id].on)?{ok:true}:{ok:false,msg:'Моторчик не крутится. Проверь: обе клеммы соединены? Цепь замкнута?'};
    }
    case 6:{
      if(!cs.some(c=>c.type==='button'))return{ok:false,msg:'Добавь кнопку! Возьми её в панели слева.'};
      if(!cs.some(c=>c.type==='bell'))return{ok:false,msg:'Добавь звонок! Возьми его в панели слева.'};
      const smP=simulate(cs,S.wires,{buttonState:'pressed'});
      const smR=simulate(cs,S.wires,{buttonState:'released'});
      const bellOn=sm=>cs.some(c=>c.type==='bell'&&sm.on[c.id]&&sm.on[c.id].on);
      if(!bellOn(smP))return{ok:false,msg:'При нажатой кнопке звонок не звенит — проверь цепочку: «+» → кнопка → звонок → «−».'};
      if(bellOn(smR))return{ok:false,msg:'Звонок должен молчать, когда кнопка не нажата! Ток должен идти ЧЕРЕЗ кнопку.'};
      return{ok:true};}
    case 7:{
      const led=cs.find(c=>c.type==='led');
      if(!led)return{ok:false,msg:'Добавь светодиод из панели слева!'};
      if(sim.on[led.id]&&sim.on[led.id].on)return{ok:true};
      if(sim.on[led.id]&&sim.on[led.id].reverse)
        return{ok:false,msg:'Светодиод подключён наоборот! Ток должен входить через его ножку «+». Поверни светодиод кнопкой ⟳ или поменяй провода.'};
      return{ok:false,msg:'Светодиод не светится — проверь, замкнута ли цепь.'};
    }
    case 8:{
      const sm=simulate(cs,S.wires,closedOpts);
      if(!lampsAllOn(sm,cs))return{ok:false,msg:'Лампочка не светится — проверь цепь.'};
      if(!sm.dim)return{ok:false,msg:'Резистор не в цепи с лампочкой! Поставь его прямо в цепочку: «+» → резистор → лампочка → «−».'};
      return{ok:true};}
  }
  return{ok:true};
}
function runCheck(){
  const r=checkGoal();
  if(r.ok){
    sWin();confetti(90);
    const fails=LV._fails||0;
    const stars=fails===0?3:(fails<=2?2:1);
    progress.stars[LV.n]=Math.max(progress.stars[LV.n]||0,stars);
    if(LV.n<8)progress.unlocked=Math.max(progress.unlocked,LV.n+1);
    else progress.unlocked=Math.max(progress.unlocked,9);
    saveProgress();
    showModal(
      '<h2>🎉 Ура! Уровень пройден!</h2>'+
      '<div class="winstars">'+[1,2,3].map(i=>'<span class="'+(i<=stars?'':'off')+'">⭐</span>').join('')+'</div>'+
      '<div class="factbox">🧠 <b>Знаешь ли ты?</b> '+(LV.fact||'')+'</div>'+
      '<p>'+(stars===3?'Идеально с первого раза! Ты настоящий электрик! ⚡':'Здорово! Попробуй ещё раз без ошибок — получишь больше звёзд!')+'</p>'+
      '<div class="btnrow"><button class="btn orange" id="mAgain">🔁 Ещё раз</button>'+
      (LV.n<8?'<button class="btn green big" id="mNext">▶ Следующий уровень</button>'
             :'<button class="btn green big" id="mNext">🛠 В песочницу!</button>')+'</div>');
    $('#mAgain').onclick=debounceBtn(()=>{closeModal();startLevel(LV.n);});
    $('#mNext').onclick=debounceBtn(()=>{closeModal();startLevel(LV.n+1);});
  }else{
    LV._fails=(LV._fails||0)+1;sFail();
    const g=$('#goalcard');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');
    toast('🤔 '+r.msg);
  }
}

let drag=null;
let placing=null;
let armed=false;

document.addEventListener('pointerdown',()=>audio(),{once:true});

/* --- панель деталей --- */
$('#palette').addEventListener('pointerdown',e=>{
  const it=e.target.closest('.pal');if(!it)return;
  const type=it.dataset.type;
  if(type==='battery'&&S.components.some(c=>c.type==='battery')){toast('Пока хватит одной батарейки 😊');return;}
  e.preventDefault();audio();
  const g=document.createElement('div');g.id='ghost';
  g.innerHTML='<svg viewBox="-44 -28 88 56">'+COMP[type].draw({props:{}},{on:false},{})+'</svg>';
  g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';
  document.body.appendChild(g);
  placing={type,ghost:g,moved:false,src:it};
});
function dist2(a,b,c,d){return Math.hypot(a-c,b-d);}
window.addEventListener('pointermove',e=>{
  if(placing){
    if(placing.sx===undefined){placing.sx=e.clientX;placing.sy=e.clientY;}
    placing.moved=dist2(e.clientX,e.clientY,placing.sx,placing.sy)>8;
    placing.ghost.style.left=e.clientX+'px';placing.ghost.style.top=e.clientY+'px';
  }
  if(drag)dragMove(e);
});
window.addEventListener('pointerup',e=>{
  if(placing){
    placing.ghost.remove();
    const overSvg=document.elementFromPoint(e.clientX,e.clientY);
    const inCanvas=overSvg&&($('#canvas').contains(overSvg)||overSvg.id==='canvas');
    if(placing.moved&&inCanvas){
      const p=svgPoint(e);if(p)placeAt(placing.type,p.x,p.y);
    }else if(!placing.moved){
      armed=armed&&armed===placing.type?false:placing.type;
      document.querySelectorAll('.pal').forEach(x=>x.classList.toggle('armed',x.dataset.type===armed));
      if(armed)toast('Теперь кликни на свободное место на поле ⬇');
    }
    placing=null;
  }
  if(drag)dragUp(e);
});

/* --- основное поле --- */
svg.addEventListener('pointerdown',e=>{
  if(e.button!==undefined&&e.button!==0)return;
  const p=svgPoint(e);if(!p)return;
  const t=e.target.closest('[data-term]');
  const cg=e.target.closest('[data-comp]');
  const wg=e.target.closest('[data-wire]');

  if(t){
    drag={mode:'wire',from:{c:+t.dataset.comp,t:+t.dataset.term},moved:false};
    svg.classList.add('wiring');audio();
    $('#wireTip').classList.add('show');
    return;
  }
  if(armed&&!cg&&!wg){
    placeAt(armed,p.x,p.y);
    armed=false;document.querySelectorAll('.pal').forEach(x=>x.classList.remove('armed'));
    return;
  }
  if(cg){
    const c=compById(+cg.dataset.comp);if(!c)return;
    S.sel=c.id;S.selWire=null;audio();
    if(c.type==='button'){c.props.pressed=true;drag={mode:'press',id:c.id};render();return;}
    drag={mode:'comp',id:c.id,dx:p.x-c.x,dy:p.y-c.y,sx:p.x,sy:p.y,moved:false};
    render();return;
  }
  if(wg){
    S.selWire=+wg.dataset.wire;S.sel=null;sClick();
    render();return;
  }
  if(S.sel!==null||S.selWire!==null){S.sel=null;S.selWire=null;$('#toolRot').style.display='';$('#comptools').classList.add('hidden');render();}
});
function dragMove(e){
  const p=svgPoint(e);if(!p)return;
  if(drag.mode==='comp'){
    const c=compById(drag.id);if(!c)return;
    if(dist2(p.x,p.y,drag.sx,drag.sy)>6)drag.moved=true;
    if(drag.moved){c.x=snap(clamp(p.x-drag.dx,60,940));c.y=snap(clamp(p.y-drag.dy,60,580));requestRender();}
  }else if(drag.mode==='wire'){
    drag.moved=true;
    const c=compById(drag.from.c);
    if(!c){drag=null;return;}
    const A=termPos(c,drag.from.t);
    const D=termDir(c,drag.from.t);
    const dir={x:p.x-A.x,y:p.y-A.y};const len=Math.hypot(dir.x,dir.y)||1;
    gTemp.innerHTML='<path class="wpath" d="'+wireD(A,D,{x:p.x,y:p.y},{x:dir.x/len,y:dir.y/len})+'" style="stroke:#ff9f1c" opacity="0.85"/>';
  }
}

let lastWireTime=0;
function dragUp(e){
  $('#wireTip').classList.remove('show');
  if(drag.mode==='comp'){
    const c=compById(drag.id);
    if(c&&!drag.moved&&c.type==='switch'){
      c.props.closed=!c.props.closed;sClick();
    }
  }else if(drag.mode==='wire'){
    svg.classList.remove('wiring');gTemp.innerHTML='';
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const t=el&&el.closest?el.closest('[data-term]'):null;
    if(t){
      const to={c:+t.dataset.comp,t:+t.dataset.term};
      const from=drag.from;
      if(to.c!==from.c||to.t!==from.t){
        const dup=S.wires.some(w=>
          (w.a.c===from.c&&w.a.t===from.t&&w.b.c===to.c&&w.b.t===to.t)||
          (w.b.c===from.c&&w.b.t===from.t&&w.a.c===to.c&&w.a.t===to.t));
        if(!dup && (Date.now() - lastWireTime) > 200){
          lastWireTime = Date.now();
          S.wires.push({id:nid(),color:WIRE_COLORS[S.wires.length%WIRE_COLORS.length],a:from,b:to});
          sPop();
        }
      }
    }
  }else if(drag.mode==='press'){
    const c=compById(drag.id);if(c)c.props.pressed=false;
  }
  drag=null;render();
}

let lastPlaceTime=0;
function placeAt(type,x,y){
  if(Date.now() - lastPlaceTime < 200) return;
  lastPlaceTime = Date.now();
  if(type==='battery'&&S.components.some(c=>c.type==='battery')){toast('Пока хватит одной батарейки 😊');return;}
  const c={id:nid(),type,x:snap(clamp(x,60,940)),y:snap(clamp(y,60,580)),rot:0,
    props:{closed:false,pressed:false}};
  S.components.push(c);S.sel=c.id;S.selWire=null;
  $('#toolRot').style.display='';
  sPop();render();
}
function deleteSel(){
  if(S.sel!==null){
    S.components=S.components.filter(c=>c.id!==S.sel);
    S.wires=S.wires.filter(w=>w.a.c!==S.sel&&w.b.c!==S.sel);
    S.sel=null;sPop();render();
  }else if(S.selWire!==null){
    S.wires=S.wires.filter(w=>w.id!==S.selWire);
    S.selWire=null;$('#toolRot').style.display='';$('#comptools').classList.add('hidden');sPop();render();
  }
}
function rotateSel(){
  if(S.sel===null)return;
  const c=compById(S.sel);if(!c)return;
  c.rot=((c.rot||0)+90)%360;sClick();render();
}
$('#toolDel').onclick=deleteSel;
$('#toolRot').onclick=rotateSel;
window.addEventListener('keydown',e=>{
  if(e.key==='Delete'||e.key==='Backspace'){if(!$('#modal').classList.contains('hidden'))return;deleteSel();}
  if(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К')rotateSel();
  if(e.key==='Escape')closeModal();
});
